<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskUp — gerencie suas tarefas.">
  <meta name="theme-color" content="#13131A">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>TaskUp</title>
  <style>
    html, body { margin: 0; height: 100%; background: #13131A; }
    /* Indicador exibido enquanto o Flutter carrega (evita tela branca). */
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; transition: opacity .3s ease;
    }
    #loading div {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid rgba(201, 190, 255, .2); border-top-color: #C9BEFF;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
